<div class="wrapper">
  <h1 class="wrapper__main-title dx-widget">Tree List</h1>
  <dx-tree-list
    meTreeList
    [dataSource]="dataSource"
    keyExpr="ID"
    parentIdExpr="Head_ID"
    [showRowLines]="showRowLines"
    [showColumnLines]="showColumnLines"
    [showBorders]="showBorders"
    [expandedRowKeys]="[1, 2, 3, 4, 5]"
    [activeStateEnabled]="activeStateEnabled"
    [allowColumnReordering]="allowColumnReordering"
    [allowColumnResizing]="allowColumnResizing"
  >
    <dxo-editing mode="row" [allowUpdating]="true" [allowDeleting]="true" [allowAdding]="true">
    </dxo-editing>

    <dxo-selection mode="multiple"></dxo-selection>

    <dxi-column dataField="Full_Name">
      <dxi-validation-rule type="required"></dxi-validation-rule>
    </dxi-column>
    <dxi-column dataField="Head_ID" caption="Head">
      <dxi-validation-rule type="required"></dxi-validation-rule>
    </dxi-column>
    <dxi-column dataField="Title" caption="Position">
      <dxi-validation-rule type="required"></dxi-validation-rule>
    </dxi-column>
    <dxi-column dataField="Hire_Date" dataType="date" [width]="120">
      <dxi-validation-rule type="required"></dxi-validation-rule>
    </dxi-column>
    <dxi-column type="buttons">
      <dxi-button name="edit" icon="edit"></dxi-button>
      <dxi-button name="delete" icon="trash"></dxi-button>
      <dxi-button name="save" icon="save"></dxi-button>
      <dxi-button name="cancel" icon="undo"></dxi-button>

      <dxi-button name="undelete" icon="undelete"></dxi-button>
    </dxi-column>
  </dx-tree-list>
</div>


<div class="wrapper">
  <h1 class="wrapper__main-title dx-widget">Tree List</h1>
  <dx-tree-list
    meTreeList
    [dataSource]="dataSource"
    keyExpr="ID"
    parentIdExpr="Head_ID"
    [showRowLines]="showRowLines"
    [showColumnLines]="showColumnLines"
    [showBorders]="showBorders"
    [activeStateEnabled]="activeStateEnabled"
    [allowColumnReordering]="allowColumnReordering"
    [allowColumnResizing]="allowColumnResizing"
    dataStructure="tree"
    [alignedColumns]="[
      { dataField: 'ID', caption: 'ID', alignment: 'right', headerAlign: 'left' },
      { dataField: 'Head_ID', caption: 'HEAD', alignment: 'right', headerAlign: 'left'},
      { dataField: 'Full_Name', caption: 'Company' },
      { dataField: 'Prefix', caption: 'Prefix' },
      { dataField: 'Title', caption: 'Title' },
      { dataField: 'City', caption: 'City' },
      { dataField: 'State', caption: 'State' },
      { dataField: 'Email', caption: 'Email' },
      { dataField: 'Skype', caption: 'Skype' },
      { dataField: 'Mobile_Phone', caption: 'Mobile_Phone' },
      { dataField: 'Birth_Date', caption: 'Birth_Date' },
      { dataField: 'Hire_Date', caption: 'Hire_Date' }
    ]"
  >
  </dx-tree-list>
</div>
