<h1 class="dx-widget wrapper__title">Form</h1>
<div id="form-demo">
  <div class="form-container">
    <div style="width: 800px; margin: 0 auto">
      <dx-form meForm [size]="'medium'" [labelMode]="'outside'" [labelLocation]="'top'">
        <dxi-item meFormItem dataField="firstName">
          <dxi-validation-rule
            type="required"
            message="First Name is required"
          ></dxi-validation-rule>
          <dxo-label text="First Name ddddddd sdsfd sdf s d"></dxo-label>
          <div *dxTemplate>
            <dx-text-box
              meTextBox
              [(value)]="formData.firstName"
              [size]="size"
              [readOnly]="readOnly"
              [disabled]="disabled"
            ></dx-text-box>
          </div>
        </dxi-item>
        <dxi-item dataField="lastName">
          <dxi-validation-rule
            type="required"
            message="Last Name is required"
          ></dxi-validation-rule>
          <dxo-label text="Last Name"></dxo-label>
          <div *dxTemplate>
            <dx-text-box
              meTextBox
              [(value)]="formData.lastName"
              [size]="size"
              [readOnly]="readOnly"
              [disabled]="disabled"
            ></dx-text-box>
          </div>
        </dxi-item>
        <dxi-item dataField="email">
          <dxi-validation-rule type="required" message="Email is required"></dxi-validation-rule>
          <dxi-validation-rule type="email" message="Email is invalid"></dxi-validation-rule>
          <dxo-label text="Email"></dxo-label>
          <div *dxTemplate>
            <dx-text-box
              meTextBox
              [(value)]="formData.email"
              [size]="size"
              [readOnly]="readOnly"
              [disabled]="disabled"
            ></dx-text-box>
          </div>
        </dxi-item>
        <dxi-item dataField="phone">
          <dxo-label text="Phone"></dxo-label>
          <div *dxTemplate>
            <dx-text-box
              meTextBox
              [(value)]="formData.phone"
              [size]="size"
              [readOnly]="readOnly"
              [disabled]="disabled"
            ></dx-text-box>
          </div>
        </dxi-item>
        <dxi-item dataField="gender">
          <dxo-label text="Gender"></dxo-label>
          <div *dxTemplate>
            <dx-select-box
              meSelectBox
              [(value)]="formData.gender"
              [items]="genderOptions"
              [size]="size"
              [readOnly]="readOnly"
              [disabled]="disabled"
            ></dx-select-box>
          </div>
        </dxi-item>
        <dxi-item dataField="birthDate">
          <dxo-label text="Birth Date"></dxo-label>
          <div *dxTemplate>
            <dx-date-box
              meDateBox
              [size]="size"
              [value]="formData.birthDate"
              [readOnly]="readOnly"
              [disabled]="disabled"
            ></dx-date-box>
          </div>
        </dxi-item>
        <dxi-item dataField="occupation">
          <dxo-label text="Occupation"></dxo-label>
          <div *dxTemplate>
            <dx-text-box
              meTextBox
              [(value)]="formData.occupation"
              [size]="size"
              [readOnly]="readOnly"
              [disabled]="disabled"
            ></dx-text-box>
          </div>
        </dxi-item>
        <dxi-item dataField="isSubscribed">
          <div *dxTemplate>
            <dx-check-box
              meCheckBox
              [value]="formData.isSubscribed"
              text="Subscribe to newsletter"
              [size]="size"
              [readOnly]="readOnly"
              [disabled]="disabled"
            ></dx-check-box>
          </div>
        </dxi-item>
        <dxi-item dataField="country">
          <dxo-label text="Country"></dxo-label>
          <div *dxTemplate>
            <dx-select-box
              meSelectBox
              [(value)]="formData.country"
              [items]="countryOptions"
              [size]="size"
              [readOnly]="readOnly"
              [disabled]="disabled"
            ></dx-select-box>
          </div>
        </dxi-item>
      </dx-form>
    </div>
  </div>
</div>
