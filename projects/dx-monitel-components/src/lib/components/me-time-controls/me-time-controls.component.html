<div class="time-controls">
  <dx-number-box
    meNumberBox
    [value]="$hours.value"
    [max]="23"
    [min]="0"
    (onFocusIn)="onFocus($event)"
    (onValueChanged)="onHoursChanges($event)"
    size="small"
    [showSpinButtons]="true"
  />
  :
  <dx-number-box
    meNumberBox
    [value]="$minutes.value"
    [max]="59"
    [min]="0"
    (onFocusIn)="onFocus($event)"
    (onValueChanged)="onMinutesChanges($event)"
    size="small"
    [showSpinButtons]="true"
  />
  :
  <dx-number-box
    meNumberBox
    [value]="$seconds.value"
    [max]="59"
    [min]="0"
    (onFocusIn)="onFocus($event)"
    (onValueChanged)="onSecondsChanges($event)"
    size="small"
    [showSpinButtons]="true"
  />
</div>
