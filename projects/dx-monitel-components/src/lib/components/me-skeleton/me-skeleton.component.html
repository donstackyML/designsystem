<ng-container *ngIf="loading; else content">
  <div class="me-skeleton" [ngStyle]="skeletonStyle">
    <ng-container *ngIf="avatar">
      <me-skeleton-item
        class="me-skeleton-avatar"
        [width]="avatarStyle.width"
        [height]="avatarStyle.height"
        [ngStyle]="avatarStyle"
        [shape]="avatar.shape ?? 'circle'"
        [animated]="animated"
      ></me-skeleton-item>
    </ng-container>
    <div class="me-skeleton-content">
      <ng-content select="[customTitle]"></ng-content>
      <ng-container *ngIf="!hasCustomTitle">
        <me-skeleton-item
          class="me-skeleton-title"
          [width]="titleStyle['width']"
          [height]="titleStyle['height']"
          [animated]="animated"
          [shape]="paragraph?.shape || shape"
        ></me-skeleton-item>
      </ng-container>

      <ng-content select="[customParagraph]"></ng-content>
      <ng-container *ngIf="!hasCustomParagraph">
        <div class="me-skeleton-paragraph">
          <me-skeleton-item
            *ngFor="let width of paragraphRows"
            class="me-skeleton-row"
            [animated]="animated"
            [width]="width"
            [height]="paragraph?.height ?? '8px'"
            [shape]="paragraph?.shape || shape"
          ></me-skeleton-item>
        </div>
      </ng-container>
    </div>
    <ng-content></ng-content>
  </div>
</ng-container>

<ng-template #content>
  <ng-content></ng-content>
</ng-template>
