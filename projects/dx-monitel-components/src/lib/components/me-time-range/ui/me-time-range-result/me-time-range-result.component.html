<div class="me-time-range-result">
  <div class="me-time-range-result__date-block">
    <div class="me-time-range-result__date-block__title me-text-caption">{{ startText }}</div>
    <div #startTimeResult class="me-time-range-result__date-block__time_text me-text-body1">
      {{ startDate ? (startDate | date: timeFormat) : '' }}
    </div>
  </div>
  <div class="me-time-range-result__date-block">
    <div class="me-time-range-result__date-block__title me-text-caption">{{ endText }}</div>
    <div #endTimeResult class="me-time-range-result__date-block__time_text me-text-body1">
      {{ endDate ? (endDate | date: timeFormat) : '' }}
    </div>
  </div>
</div>
