<div
  class="me-menu-left_item"
  [class.me-menu-left_item-collapsed]="collapsed"
  [class.me-menu-left_item-uncollapsed]="!collapsed"
  [class.me-menu-left_item-selected]="item.selected"
  [class.me-menu-left_item-expanded]="item.expanded"
  [class.me-menu-left_item-pressed]="isPressed()"
  [class.me-menu-left_item-with-children]="item.items?.length"
  *ngIf="item"
  tabIndex="0"
>
  <div class="me-menu-left_item-content" [ngStyle]="{ 'margin-left.px': offset }">
    <me-icon *ngIf="icon" [name]="icon" [size]="20" class="me-menu-left_item-icon"></me-icon>
    <span *ngIf="!collapsed" class="me-menu-left_item-text">{{ item.text }}</span>
  </div>
  <div class="me-menu-left_item-right">
    <div *ngIf="item.badge" class="me-menu-left_item-badge">
      <span *ngIf="!collapsed">{{ item.badge }}</span>
    </div>
    <me-icon [name]="item.expanded ? expandedIcon : collapsedIcon" [size]="20" *ngIf="item.items?.length && !collapsed"></me-icon>
  </div>
</div>
