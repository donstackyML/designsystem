<div #sidepage class="me-sidepage me-scrollbar-visible me-scroll-view" [style.z-index]="zIndex">
  <div
    *ngIf="isResizable && isSidePageOpen && isHorizontal"
    class="resize-handle-horizontal"
    [class.resize-handle-horizontal-top]="position === 'top'"
    [class.resize-handle-horizontal-bottom]="position === 'bottom'"
    (mousedown)="onResizeStart($event)"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="12" viewBox="0 0 20 12" fill="none">
      <path
        d="M17 7L17 9L15 9L15 7L17 7ZM17 3L17 5L15 5L15 3L17 3ZM13 7L13 9L11 9L11 7L13 7ZM13 3L13 5L11 5L11 3L13 3ZM9 7L9 9L7 9L7 7L9 7ZM9 3L9 5L7 5L7 3L9 3ZM5 7L5 9L3 9L3 7L5 7ZM5 3L5 5L3 5L3 3L5 3Z"
        fill="currentColor"
      />
    </svg>
  </div>

  <ng-content select="[sidepage-header]"></ng-content>
  <div class="me-sidepage-content">
    <dx-scroll-view>
      <ng-content select="[sidepage-content]"></ng-content>
    </dx-scroll-view>
  </div>
  <ng-content select="[sidepage-footer]"></ng-content>
  <div
    *ngIf="isResizable && isSidePageOpen && (position === 'right' || position === 'left')"
    class="resize-handle"
    [class.resize-handle-right]="position === 'right'"
    [class.resize-handle-left]="position === 'left'"
    (mousedown)="onResizeStart($event)"
  >
    <svg width="8" height="20" viewBox="0 0 8 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 17L1 17L1 15L3 15L3 17Z" fill="currentColor" />
      <path d="M3 13L1 13L1 11L3 11L3 13Z" fill="currentColor" />
      <path d="M3 9L1 9L1 7L3 7L3 9Z" fill="currentColor" />
      <path d="M3 5L1 5L1 3L3 3L3 5Z" fill="currentColor" />
      <path d="M7 17L5 17L5 15L7 15L7 17Z" fill="currentColor" />
      <path d="M7 13L5 13L5 11L7 11L7 13Z" fill="currentColor" />
      <path d="M7 9L5 9L5 7L7 7L7 9Z" fill="currentColor" />
      <path d="M7 5L5 5L5 3L7 3L7 5Z" fill="currentColor" />
    </svg>
  </div>
</div>
