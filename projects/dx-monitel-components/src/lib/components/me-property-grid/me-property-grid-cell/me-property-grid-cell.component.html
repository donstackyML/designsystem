<div class="property-grid-row">
  <ng-container *ngIf="displayMode === 'default'">
    <ng-container *ngIf="hasFullCellContent; else customContent">
      <div class="full-cell">
        <ng-content select="[fullCell]"></ng-content>
      </div>
    </ng-container>
    <ng-template #customContent>
      <div class="property-grid-cell">
        <div class="property-grid-cell-part property-grid-cell-part-left">
          <div
            class="property-grid-cell-part-content"
            [ngClass]="[hasProjectedLeftCell ? 'property-grid-custom-value-content' : '', 'justify-cell-' + justifyLeftCell]"
          >
            <ng-container *ngIf="hasProjectedLeftCell; else defaultLeftTemplate">
              <ng-content select="[leftCell]"></ng-content>
            </ng-container>
            <ng-template #defaultLeftTemplate>
              <div class="cell-text me-tables-row-text">
                <span *ngIf="name">{{ name }}</span>
                <span *ngIf="showRequiredMark" class="required-mark">&nbsp;*</span>
              </div>
              <div class="cell-actions">
                <button
                  *ngIf="showAdditionalProperties"
                  type="button"
                  class="cell-action-button"
                  [class.cell-action-button--selected]="isExpanded"
                  (click)="onClickOpenMoreProperties()"
                >
                  <me-icon class="icon" [name]="isExpanded ? 'pan_zoom_out_me_x20' : 'pan_zoom_x20'"></me-icon>
                </button>
              </div>
            </ng-template>
          </div>
        </div>
        <div #resizeDivider class="divider"></div>
        <div class="property-grid-cell-part property-grid-cell-part-right">
          <div
            class="property-grid-cell-part-content"
            [ngClass]="[hasProjectedRightCell ? 'property-grid-custom-value-content' : '', 'justify-cell-' + justifyRightCell]"
          >
            <ng-container *ngIf="hasProjectedRightCell; else defaultRightTemplate">
              <ng-content></ng-content>
            </ng-container>
            <ng-template #defaultRightTemplate>
              <ng-container>
                <div class="cell-actions" meWrapComponents>
                  <ng-content select="[rightCellStartActions]"></ng-content>
                </div>
                <div class="cell-text me-tables-row-text">
                  <ng-content *ngIf="!value; else cellValueContent" select="[cellValue]"></ng-content>
                  <ng-template #cellValueContent>
                    {{ value }}
                  </ng-template>
                </div>
                <div class="cell-actions" meWrapComponents>
                  <ng-content select="[rightCellEndActions]"> </ng-content>
                  <button *ngIf="readOnly" type="button" class="cell-action-button" (click)="copyValue(value)">
                    <me-icon class="icon" name="content_copy_x20"></me-icon>
                  </button>
                </div>
              </ng-container>
            </ng-template>
          </div>
        </div>
      </div>
    </ng-template>
  </ng-container>

  <ng-container *ngIf="isExpanded || displayMode === 'additionalOnly'">
    <div class="property-grid-cell-additional-properties" [ngClass]="'align-cell-' + alignAdditionalPropertiesCell">
      <ng-content select="[additionalProperties]"></ng-content>
    </div>
  </ng-container>
</div>
