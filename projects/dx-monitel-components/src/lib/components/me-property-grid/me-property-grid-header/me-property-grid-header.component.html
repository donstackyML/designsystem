<button type="button" class="property-grid-header" [class.open]="isOpen" (click)="onToggle()">
  <div class="cell-actions">
    <me-icon name="arrow_drop_down_x20" class="drop-down-icon" [class.drop-down-icon-up]="isOpen" [class.drop-down-icon-down]="!isOpen" />
    <ng-content select="[property-grid-header-left-actions]"></ng-content>
  </div>
  <span class="me-property-grid-header-title me-tables-column-title">{{ title }}</span>
  <ng-content select="[property-grid-header-right-actions]"></ng-content>
</button>
