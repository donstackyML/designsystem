<div
  class="property-grid-header"
  [class.open]="isOpen"
  (click)="onToggle()"
  tabindex="0"
  role="button"
  (keydown.enter)="onToggle()"
  (keydown.space)="onToggle()"
>
  <div class="cell-actions">
    <me-icon
      name="arrow_drop_down_x20"
      class="drop-down-icon"
      [class.drop-down-icon-up]="isOpen"
      [class.drop-down-icon-down]="!isOpen"
    />
    <div
      class="cell-actions--left-actions"
      (click)="$event.stopPropagation()"
      tabindex="-1"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <ng-content select="[property-grid-header-left-actions]"></ng-content>
    </div>
  </div>
  <span class="me-property-grid-header-title me-tables-column-title">
    {{ title }}
  </span>
  <div
    class="cell-actions--right-actions"
    (click)="$event.stopPropagation()"
    tabindex="-1"
    (keydown.enter)="$event.stopPropagation()"
    (keydown.space)="$event.stopPropagation()"
  >
    <ng-content select="[property-grid-header-right-actions]"></ng-content>
  </div>
</div>
