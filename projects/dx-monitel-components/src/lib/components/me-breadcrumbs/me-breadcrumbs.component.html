<nav #breadcrumbsContainer class="breadcrumbs" [ngClass]="'breadcrumbs-' + size" aria-label="Breadcrumbs">
  <dx-button #leftBtn class="breadcrumbs__left-btn" *ngIf="overflowLeft" stylingMode="text" (onClick)="showOverflowMenu('left', $event)">
    <me-icon [name]="moreHorizX20.name"></me-icon>
  </dx-button>

  <ng-container *ngFor="let item of normalizedItems">
    <div #breadcrumbItem class="menu-item" [ngClass]="'menu-item-' + size">
      <dx-button meButton text="{{ item.text }}" stylingMode="text" (onClick)="onItemClick(item)" icon="{{ item.icon }}" [size]="size"></dx-button>

      <dx-drop-down-button
        meDropDownButton
        #dropDownButton
        icon="chevronright"
        displayExpr="text"
        [dataSource]="item.items || []"
        stylingMode="text"
        keyExpr="id"
        [showArrowIcon]="false"
        (onItemClick)="onSubmenuItemClick($event)"
        [disabled]="!!item.disabled || !item.items?.length"
        [size]="size"
      ></dx-drop-down-button>
    </div>
  </ng-container>

  <dx-button #rightBtn *ngIf="overflowRight" class="breadcrumbs__right-btn" stylingMode="text" (onClick)="showOverflowMenu('right', $event)">
    <me-icon [name]="moreHorizX20.name"></me-icon>
  </dx-button>
</nav>
<dx-context-menu
  #overflowMenu
  meContextMenu
  class="context-menu"
  [dataSource]="overflowItems"
  [position]="contextMenuPosition"
  [activeStateEnabled]="true"
  (onPositioning)="onContextMenuPositioning($event)"
  (onItemClick)="onOverflowItemClick($event)"
  [showEvent]="''"
  [subMenuMaxHeight]="maxHeight"
  [size]="size"
>
  <div
    *dxTemplate="let data of 'item'"
    class="context-menu-item"
    [ngClass]="'context-menu-item-' + size"
    (mousedown)="onContextMenuItemMouseDown($event)"
    (mouseup)="onContextMenuItemMouseUp($event)"
    (mouseleave)="onContextMenuItemMouseUp($event)"
  >
    <span>{{ data.text }}</span>
    <i *ngIf="data.items?.length" class="dx-icon-spindown"></i>
  </div>
</dx-context-menu>
