<div class="me-pagination" [ngClass]="[transparentBackground ? 'me-pagination--transparent' : 'me-pagination--filled', 'me-pagination--' + size]">
  <div class="me-pagination__size-controls" [ngClass]="size">
    <ng-container *ngIf="useButtons; else dropDownTemplate">
      <dx-button
        *ngFor="let item of itemsPerPageOptions"
        [type]="itemsPerPage === item ? 'default' : 'normal'"
        [text]="item.toString()"
        (onClick)="changeItemsPerPage(item)"
      ></dx-button>
    </ng-container>
    <ng-template #dropDownTemplate>
      <dx-drop-down-button
        meDropDownButton
        [width]="80"
        [size]="size"
        [text]="selectedValue?.toString() || ''"
        [items]="dropDownItems"
        stylingMode="contained"
        displayExpr="text"
        [tabIndex]="0"
        (onItemClick)="onItemClick($event)"
      >
      </dx-drop-down-button>
    </ng-template>
  </div>

  <div class="me-pagination__controls" [ngClass]="size">
    <span class="me-pagination__info">Записей: {{ totalItems }}</span>

    <dx-button stylingMode="text" [disabled]="currentPage === 1" (onClick)="prevPage()" icon="chevronleft"></dx-button>

    <ng-container *ngFor="let page of pages; trackBy: trackByFn">
      <ng-container *ngIf="page !== '...'">
        <dx-button
          [stylingMode]="page === currentPage ? 'contained' : 'outlined'"
          [text]="page.toString()"
          (onClick)="changePage(page)"
          [type]="page === currentPage ? 'default' : 'normal'"
          [style.backgroundColor]="transparentBackground && !isDarkTheme && page !== currentPage ? 'transparent' : ''"
          [style.color]="transparentBackground && !isDarkTheme && page !== currentPage ? '#007bff' : ''"
        ></dx-button>
      </ng-container>
      <span *ngIf="page === '...'" class="me-pagination__ellipsis">...</span>
    </ng-container>

    <dx-button stylingMode="text" [disabled]="currentPage === totalPages" (onClick)="nextPage()" icon="chevronright"></dx-button>
  </div>
</div>
